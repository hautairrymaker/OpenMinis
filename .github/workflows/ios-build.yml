name: iOS Build

# Builds the iOS app on a macOS runner. The native dependencies (LAME, FFmpeg,
# iSH, Alpine rootfs, rclone) are compiled from source by deps/*.sh — see
# BUILDING.md. That is the expensive part of this workflow: a cold run takes
# 30-60 minutes, so this is deliberately manual-dispatch-only. Trigger it when
# you have accumulated enough changes to be worth the macOS minutes.
#
# Signing is NOT configured: the product is an unsigned .app for inspection
# and for re-signing locally with your own certificate. macOS runners are
# billed at 10x the Linux rate on private repositories.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS app
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          go version || true

      - name: Install Homebrew dependencies
        run: |
          # `lld` provides the linker build_ish.sh asks for via -fuse-ld=lld.
          # pkgconf (not the `pkg-config` formula alias) is what Homebrew ships;
          # without it on PATH, configure finds Apple's /usr/bin/false stub,
          # reports "pkg-config: NO", and silently drops libarchive.
          brew install ninja llvm lld libarchive pkgconf
          # Homebrew's python is PEP 668 "externally managed" — a plain
          # `pip install` is refused. Use a venv on PATH instead.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/venv/bin/pip" install meson
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/meson" --version
          # Homebrew's bin must precede /usr/bin so pkgconf wins over the stub.
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix libarchive)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$(brew --prefix)/opt/lld/bin" >> "$GITHUB_PATH"

      # rclone-mobile's go.mod asks for go 1.25.5, and its rclone v1.75.0
      # dependency compiles against go-json-experiment's 1.25-era API. The
      # runner's preinstalled Go (1.27.x) is new enough that those symbols
      # moved, so an unpinned toolchain fails with "undefined: json.SkipFunc".
      # GOTOOLCHAIN=local makes go honour this exact version instead of
      # silently upgrading to whatever go.mod's toolchain line requests.
      - name: Install pinned Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          check-latest: false
          cache: false

      - name: Pin GOTOOLCHAIN
        run: |
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          go version

      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || echo "Metal toolchain unavailable; FFmpeg will drop the Metal deinterlacer"

      - name: Copy build-time config templates
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig
          # Empty values are valid — the app builds and runs without them.

      # Cache the native dependency outputs so only a first run pays full price.
      - name: Cache native dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
          key: native-deps-${{ runner.os }}-${{ hashFiles('deps/*.sh', 'deps/ffmpeg-patch/**', 'deps/lame-3.100/**') }}
          restore-keys: |
            native-deps-${{ runner.os }}-

      - name: Build LAME
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./deps/build_lame.sh

      - name: Build FFmpeg
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./deps/build_ffmpeg.sh

      - name: Build iSH
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./deps/build_ish.sh

      - name: Prepare Alpine rootfs
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./deps/prepare_alpine_rootfs.sh

      - name: Build rclone
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./deps/build_rclone_ios.sh

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration "${{ inputs.configuration }}" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | xcbeautify || \
          (echo '--- build failures ---'; grep -n 'error:' build.log | head -80; exit 1)

      - name: Package unsigned app
        run: |
          APP=$(find build/Build/Products -name 'Minis.app' -maxdepth 3 | head -1)
          echo "Found: $APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry Minis-unsigned.ipa Payload
          ls -lh Minis-unsigned.ipa
          du -sh Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Minis-${{ inputs.configuration }}-unsigned
          path: out/Minis-unsigned.ipa
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
